<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <canvas></canvas>

  <div class="wp-main">

    <!-- nav -->
    <header id="wp-navheader">
      <div id="wp-navbar">
        <a href="../index.html" class="wp-navlink-back wp-navL">
          <span class="wp-ico wp-ico--26 wp-ico--light">←</span>
          Home
        </a>
        <a href="../index.html" id="wp-logo">
          <span class="wp-wordmark">FadedVeil</span>
        </a>
      </div>
    </header>

    <!-- design gallery -->
    <section class="wp-library">

      <!-- heading row -->
      <div class="wp-library-head">
        <div>
          <div class="wp-eyebrow">
            <span class="wp-eyebrow-dash"></span>
            EXPLORE
          </div>
          <h1 class="wp-heading wp-library-title">Graphic Designs</h1>
        </div>
        <span class="wp-games-meta">All of my designs, all in one place · click to enlarge</span>
      </div>

      <!-- card template (image-only, same as home carousel) -->
      <template class="wp-card-template">
        <a href="#" class="wp-card-link wp-card wp-design-card">
          <!-- card key art -->
          <div class="wp-card-art"></div>
        </a>
      </template>

      <!-- vertical grid of design cards (populated by library.js) -->
      <div class="wp-library-grid"></div>

    </section>

    <!-- ===== LIGHTBOX ===== -->
    <div id="wp-lightbox">
      <div id="wp-lightbox-backdrop"></div>
      <button id="wp-lightbox-close" aria-label="Close">✕</button>
      <img id="wp-lightbox-img" src="" alt="">
    </div>

    <!-- footer -->
    <footer class="wp-game-footer">
      <a href="../index.html" class="wp-game-footer-back">
        <span class="wp-ico wp-ico--22 wp-ico--yellow">←</span>
        <span class="wp-wordmark">
          FadedVeil
        </span>
      </a>
      <span class="wp-game-copyright">© 2026 FadedVeil.</span>
    </footer>

  </div>

  <!-- ===== PRODUCT PROMO WIDGET ===== -->
  <a href="promo.html" id="wp-promo-widget" aria-label="Check out our new product">
    <span class="wp-promo-icon">
      <span class="wp-promo-ring"></span>
      <img src="../assets/promo_assets/icon.png" alt="">
    </span>
    <span class="wp-promo-label">Click me</span>
  </a>

  <script src="../scripts/library.js" type="module"></script>
  <script src="../scripts/cursor.js" type="module"></script>
  <script src="../scripts/promo-widget.js" type="module"></script>

</body>

</html>

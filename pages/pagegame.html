<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <div class="wp-main">

    <!-- nav -->
    <header id="wp-navheader">
      <div id="wp-navbar">
        <a href="../index.html" class="wp-navlink-back wp-navL">
          <span class="wp-ico wp-ico--26 wp-ico--light">←</span>
          All games
        </a>
        <a href="../index.html" id="wp-logo">
          <span class="wp-wordmark">Dior Zaverdino</span>
        </a>
        <a href="#" class="wp-btn wp-btn--yellow wp-cta-navwish wp-navR">★
          Wishlist</a>
      </div>
    </header>

    <!-- hero -->
    <section class="wp-game-hero">
      <!-- parallax background layer (art applied by pagegame.js) -->
      <div id="wp-game-hero-bg"></div>
      <div class="wp-game-hero-inner">
        <div class="wp-hero-in wp-delay-1 wp-game-badge">
          tag · year</div>
        <h1 class="wp-hero-in wp-delay-2 wp-heading wp-game-title">
          title</h1>
        <div class="wp-hero-in wp-delay-3 wp-game-actions">
          <a href="#" class="wp-btn wp-btn--dark wp-cta-wishlist">★
            Wishlist now</a>
          <a href="#" class="wp-btn wp-btn--glass wp-cta-trailer">▶
            Watch trailer</a>
        </div>
      </div>
    </section>

    <!-- overview + details -->
    <section id="wp-detail-grid" class="wp-reveal">
      <div>
        <div class="wp-eyebrow">
          <span class="wp-eyebrow-dash"></span>OVERVIEW
        </div>
        <p class="wp-game-lead">
          Game Lead
        </p>
        <p class="wp-game-text">
          Details
        </p>
        <div class="wp-roles-label">MY ROLES</div>
        <div class="wp-role-row">
          <!-- role pills injected by pagegame.js -->
        </div>
      </div>

      <div class="wp-detail-card">
        <div class="wp-detail-title">
          DETAILS
        </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Platform</span>
            <span class="wp-detail-v">Windows</span>
          </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Available on</span>
            <span class="wp-detail-v">Itch</span>
          </div>
        <a href="https://itch.io/abovetuna" class="wp-cta-buy">
          Play Now
        </a>
      </div>
    </section>

    <!-- screenshots -->
    <section class="wp-reveal wp-shots-section">
      <div class="wp-eyebrow wp-shots-head">
        <span class="wp-eyebrow-dash"></span>SCREENSHOTS
      </div>
      <div class="wp-scroll wp-shots-scroll">
        <div class="wp-shot"> </div>
        <div class="wp-shot"> </div>
        <div class="wp-shot"> </div>
      </div>
    </section>

    <!-- footer -->
    <footer class="wp-game-footer">
      <a href="../index.html" class="wp-game-footer-back">
        <span class="wp-ico wp-ico--22 wp-ico--yellow">←</span>
        <span class="wp-wordmark">
          Dior Zaverdino
        </span>
      </a>
      <span class="wp-game-copyright">© 2026 Dior Zaverdino.</span>
    </footer>

  </div>

  <script src="../scripts/pagegame.js" type="module"></script>
  <script src="../scripts/data.js" type="module"></script>

</body>

</html>
